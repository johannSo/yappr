[package]
name = "yappr"
version = "0.2.4"
description = "Press-to-start, press-to-stop dictation for Hyprland"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yappr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yappr-core = { path = "../crates/yappr-core" }
tracing.workspace = true
anyhow = "1"
# For `bench.rs`'s `read_wav_16k_mono`, moved here from `owf-cli` (matches
# its pinned version).
hound = "3.5"
# The tray (`tray.rs`): a native StatusNotifierItem, not Tauri's `tray-icon`
# feature -- see that module's doc comment for why. Pinned to the 0.2 line
# deliberately, not the newer 0.3 (zbus 5, async, needs a tokio/async-io
# runtime): 0.2's `TrayService::spawn` runs on a plain OS thread with the
# classic blocking `dbus` crate, matching "ksni runs its own event loop on
# its own thread" with no async runtime to wire up. It also adds nothing
# new to the dependency graph -- `tao` (already a transitive dependency of
# `tauri` on Linux) already resolves `dbus 0.9.12`, exactly what 0.2 needs.
ksni = "0.2"

# Linux-only, and only for one call: WebKitGTK's WebView widget enforces an
# internal minimum natural size (~200 logical px tall) that GTK's box
# layout will not shrink below, no matter what `tauri.conf.json`'s
# width/height/minHeight say -- confirmed empirically (see lib.rs's
# `relax_webkitgtk_minimum_size`). The fix is
# `gtk_widget_set_size_request(webview, -1, -1)` on the raw widget, which
# only `PlatformWebview::inner()` exposes. Pinned to the same version wry
# already resolves in Cargo.lock, so this adds no new dependency graph
# node, just direct access to one already-present crate.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
# `layer.rs`'s `anchor_overlay` -- spec §6. The only published gtk3
# `wlr-layer-shell` binding (marked "UNMAINTAINED" on crates.io, but its
# generated surface is exactly what `anchor_overlay` uses: the `LayerShell`
# trait, `Edge`/`Layer`/`KeyboardMode`, `init_layer_shell`/`set_layer`/
# `set_anchor`/`set_layer_shell_margin`/`set_keyboard_mode`/`is_supported` --
# verified against 0.8.2's own generated source, not memory or its README).
# Default features are empty; `v0_6` unlocks `set_keyboard_mode` and (via
# `v0_5`, which it implies) `is_supported`, both load-bearing here --
# `is_supported` is the live runtime check `anchor_overlay` uses to decide
# whether to attempt layer-shell at all, and `set_keyboard_mode` is
# invariant 2's enforcement on that path.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[features]
# This feature is used for production builds, or when a plain `cargo
# build`/`cargo build --release` (rather than the Tauri CLI's `tauri
# build`) should embed `frontendDist` instead of pointing at `devUrl`'s
# dev server. Deliberately NOT a default feature: `tauri::generate_context!`
# resolves `dev: cfg!(not(feature = "custom-protocol"))`, so leaving it off
# by default is what lets `bun run tauri dev` keep talking to the live Vite
# server on port 1420. Standalone production builds of the overlay binary
# must pass `--features custom-protocol` explicitly, e.g.:
#   cargo build --release -p yappr --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

