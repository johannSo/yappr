[package]
name = "openwhisprflow-settings"
version = "0.1.0"
description = "OpenWhisprFlow settings window"
edition = "2021"

[lib]
name = "openwhisprflow_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Same trap as the overlay's: without this, `tauri::generate_context!` embeds
# `devUrl` instead of `frontendDist` and the window is blank unless a Vite dev
# server happens to be running. Deliberately not a default feature so
# `bun run tauri dev` keeps working.
custom-protocol = ["tauri/custom-protocol"]
