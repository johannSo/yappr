[workspace]
resolver = "2"
members = ["crates/yappr-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.2.2"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
regex = "1.13"
ureq = { version = "3.4", features = ["json"] }
