[package]
name = "yappr-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
regex.workspace = true
ureq.workspace = true
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.5"
sherpa-onnx = "1.13.6"
# S1-mini runs in-process, not behind a spawned `llama-server`: this is what
# removes the `llama-cpp` and `ggml-cpu` system packages from the install
# instructions, and with them the whole class of "no backends are loaded"
# startup failure `setup.rs` used to have to detect. Statically linked --
# `ldd` on the built binary resolves no `libllama`/`libggml` at all.
llama-cpp-2 = "0.1.154"
# One decoder is threaded through a whole generation in `llama.rs` so a
# multi-byte codepoint split across two BPE tokens survives detokenizing --
# German umlauts are exactly that case. Already in Cargo.lock as a
# dependency of `llama-cpp-2`, so this adds no node to the graph.
encoding_rs = "0.8"
hound = "3.5"
whatlang = "0.18"
# Levenshtein for the dictation vocabulary. Already in Cargo.lock as a
# transitive dependency, so this adds no node to the graph.
strsim = "0.11"
cpal = "0.18"
rubato = "5.0"
# Synchronous, self-pipe-based signal handling for the daemon's SIGTERM/
# SIGINT/SIGHUP shutdown path (fix 2) -- no async runtime, matching the rest
# of `server.rs`.
signal-hook = "0.3"
# The focused window on GNOME, where no other interface will say (`gnome.rs`).
# AT-SPI is D-Bus-only and the protocol is not worth reimplementing: event
# registration alone means talking to the registry, match rules and the
# accessible tree. Default features pull `atspi-connection` and
# `atspi-proxies` over zbus, and deliberately *not* `tokio` -- without it
# zbus uses async-io, so the async this drags in is driven by a `block_on`
# on one dedicated thread inside `gnome.rs` and reaches no other module.
# `server.rs` stays synchronous. The `zbus` feature is only the re-export
# of the zbus atspi already depends on -- `gnome.rs` needs
# `zbus::fdo::DBusProxy` to ask the bus for a peer's pid, and borrowing
# atspi's copy is what keeps that from becoming a second zbus version.
atspi = { version = "0.30", features = ["zbus"] }
futures-lite = "2"
# The XDG Desktop Portal's RemoteDesktop interface, which is how the `libei`
# injection backend presses its paste chord (`libei.rs`). Pure Rust over the
# same zbus `atspi` already pulls -- `cargo tree -d -p yappr-core | grep zbus`
# must keep reporting exactly one copy -- so nothing new is linked, no
# `libei.so` is needed at runtime, and the `ubuntu:22.04` distrobox AppImage
# build is unaffected. Three features, all deliberate:
#   - `async-io`, never `tokio`: this crate is synchronous and `server.rs` must
#     stay that way, so the async lives behind a `block_on` on one thread
#     exactly as `gnome.rs`'s does. ashpd's *default* feature is `tokio`, which
#     is why default features are off.
#   - `remote_desktop`, the interface itself.
#   - `screencast`, which ashpd 0.13.13's `remote_desktop` needs and does not
#     declare: `remote_desktop.rs` imports `screencast::Stream` unconditionally
#     and the crate does not compile without it. Not a source we use -- yappr
#     asks for a keyboard and nothing else.
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "remote_desktop",
    "screencast",
] }
# Timeouts for the portal round trips. `procutil::run_with_timeout` does not
# apply -- there is no subprocess here -- but invariant 6's rule does, and
# nothing in `futures-lite` can express a deadline. Already in `Cargo.lock`
# under zbus's `async-io` feature, so this adds no node to the graph.
async-io = "2"

[dev-dependencies]
hound = "3.5"
