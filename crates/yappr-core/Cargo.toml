[package]
name = "yappr-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Surgical, comment-preserving config writes for the settings GUI: serializing
# `Config` back with `toml::to_string` would flatten every comment and reorder
# every section of a file the user is also invited to edit by hand. Already in
# Cargo.lock as a transitive dependency of `toml`, so this adds no graph node.
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
regex.workspace = true
ureq.workspace = true
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.5"
sherpa-onnx = "1.13.6"
# S1-mini runs in-process, not behind a spawned `llama-server`: this is what
# removes the `llama-cpp` and `ggml-cpu` system packages from the install
# instructions, and with them the whole class of "no backends are loaded"
# startup failure `setup.rs` used to have to detect. Statically linked --
# `ldd` on the built binary resolves no `libllama`/`libggml` at all.
llama-cpp-2 = "0.1.154"
# One decoder is threaded through a whole generation in `llama.rs` so a
# multi-byte codepoint split across two BPE tokens survives detokenizing --
# German umlauts are exactly that case. Already in Cargo.lock as a
# dependency of `llama-cpp-2`, so this adds no node to the graph.
encoding_rs = "0.8"
hound = "3.5"
whatlang = "0.18"
# Levenshtein for the dictation vocabulary. Already in Cargo.lock as a
# transitive dependency, so this adds no node to the graph.
strsim = "0.11"
cpal = "0.18"
rubato = "5.0"
# Synchronous, self-pipe-based signal handling for the daemon's SIGTERM/
# SIGINT/SIGHUP shutdown path (fix 2) -- no async runtime, matching the rest
# of `server.rs`.
signal-hook = "0.3"

[dev-dependencies]
hound = "3.5"
