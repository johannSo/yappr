[package]
name = "owf-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Surgical, comment-preserving config writes for the settings GUI: serializing
# `Config` back with `toml::to_string` would flatten every comment and reorder
# every section of a file the user is also invited to edit by hand. Already in
# Cargo.lock as a transitive dependency of `toml`, so this adds no graph node.
toml_edit = "0.25"
tracing.workspace = true
dirs.workspace = true
regex.workspace = true
ureq.workspace = true
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.5"
sherpa-onnx = "1.13.6"
hound = "3.5"
whatlang = "0.18"
# Levenshtein for the dictation vocabulary. Already in Cargo.lock as a
# transitive dependency, so this adds no node to the graph.
strsim = "0.11"
cpal = "0.18"
rubato = "5.0"

[dev-dependencies]
hound = "3.5"
httpmock = "0.8"

[features]
# Exposes test-only construction helpers (e.g. `LlamaServer::from_child`) to
# other crates in the workspace so *their* tests can stub out a process that
# can't run in CI or this sandbox (a real `llama-server` needs a model file
# and a working ggml compute backend). Never enabled outside test builds.
test-util = []
