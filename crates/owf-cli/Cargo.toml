[package]
name = "owf-cli"
edition.workspace = true
version.workspace = true

[dependencies]
owf-core = { path = "../owf-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[lib]
name = "owf_cli"
path = "src/lib.rs"

# No `[[bin]]` any more: the `openwhisprflow` binary now dispatches every
# route this crate produces (`src-tauri/src/client.rs`). This crate keeps
# only `route()` until Task 11 deletes it entirely.

[dev-dependencies]
owf-core = { path = "../owf-core", features = ["test-util"] }
