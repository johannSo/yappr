[package]
name = "owf-cli"
edition.workspace = true
version.workspace = true

[dependencies]
owf-core = { path = "../owf-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hound = "3.5"
# Synchronous, self-pipe-based signal handling for the daemon's SIGTERM/
# SIGINT/SIGHUP shutdown path (fix 2) -- no async runtime, matching the rest
# of this binary.
signal-hook = "0.3"

[lib]
name = "owf_cli"
path = "src/lib.rs"

# One binary, three jobs. `owf-ctl` keeps the name because the compositor's
# push-to-talk keybinding runs it on every key press and release; the daemon
# and the benchmark became `owf-ctl daemon` and `owf-ctl bench`.
[[bin]]
name = "owf-ctl"
path = "src/bin/owf-ctl.rs"

[dev-dependencies]
owf-core = { path = "../owf-core", features = ["test-util"] }
