# Release pipeline. There is deliberately no branch CI here — the test gate
# (`cargo test --workspace` including `-- --ignored`, see CLAUDE.md) needs
# downloaded models and real hardware quirks, so it stays local. This file
# does exactly one thing: build a Linux AppImage when a release is cut.
#
# How to cut a release (from your machine):
#
#     glab release create v0.2.0 --notes "what changed"
#
# That creates the tag and the release; the tag pipeline below builds the
# AppImage and attaches it to that release. Watch it with `glab ci status`.
# (A bare `git push --tags` also works — the job then creates the release
# itself instead of uploading into an existing one.)

stages:
  - release

build-appimage:
  stage: release
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
  # The workspace compiles llama.cpp from source and links sherpa-onnx; a cold
  # build on a small shared runner is comfortably over the 1 h default.
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
    # Cargo's registry/git caches must live inside the project dir to be
    # cacheable by GitLab. `target/` is deliberately NOT cached — it is far
    # over gitlab.com's cache size limit for this workspace.
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
    # linuxdeploy (which `tauri build` downloads and runs) is itself an
    # AppImage, and there is no FUSE inside a docker executor: this makes it
    # self-extract instead of failing to mount.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    # Matches the verified invocation from CLAUDE.md's AppImage notes: the
    # strip step is a known way to lose the whole bundle, and the size it
    # would save is noise next to the statically linked models runtime.
    NO_STRIP: "1"
    GLAB_VERSION: "1.115.0"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
  script:
    # --- toolchains ---------------------------------------------------------
    # webkit2gtk/gtk/layer-shell/librsvg: Tauri v2 + layer.rs (gtk-layer-shell
    # is a hard link-time dependency — the build fails outright without it).
    # libasound2-dev: cpal. cmake/clang/libclang: llama-cpp-sys-2 (cmake build
    # + bindgen). The C++ ABI flag that keeps sherpa-onnx and llama.cpp
    # compatible comes from the checked-in .cargo/config.toml (force = true),
    # so nothing here needs to set CXXFLAGS — and nothing here may.
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      build-essential pkg-config cmake clang libclang-dev
      curl wget ca-certificates git file unzip xz-utils xdg-utils
      libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev
      librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev
      libasound2-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - curl -fsSL -o /tmp/glab.deb "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${GLAB_VERSION}/glab_${GLAB_VERSION}_linux_amd64.deb"
    - apt-get install -y /tmp/glab.deb
    # --- build --------------------------------------------------------------
    # `tauri build` enables the custom-protocol feature itself (the embedded
    # frontendDist — see CLAUDE.md on why a plain cargo build gives a blank
    # window) and runs `bun run build` as beforeBuildCommand.
    - bun install --frozen-lockfile
    - bun run tauri build --bundles appimage
    - ls -lh target/release/bundle/appimage/
    # --- attach to the release ----------------------------------------------
    # Normal path: `glab release create` on your machine already made the
    # release, so this just uploads the asset. Bare-tag path: no release
    # exists yet, so create one carrying the asset. If the job token is ever
    # rejected here, put a project access token (Developer role, `api` scope)
    # in a masked CI/CD variable and use that as GITLAB_TOKEN instead.
    - export GITLAB_TOKEN="$CI_JOB_TOKEN"
    - export GITLAB_HOST="$CI_SERVER_URL"
    - |
      if glab release view "$CI_COMMIT_TAG" >/dev/null 2>&1; then
        glab release upload "$CI_COMMIT_TAG" target/release/bundle/appimage/*.AppImage
      else
        glab release create "$CI_COMMIT_TAG" target/release/bundle/appimage/*.AppImage --notes "Automated release build for $CI_COMMIT_TAG."
      fi
  # Keep the AppImage on the job too, so a failed upload step doesn't cost a
  # 40+ minute rebuild to retry.
  artifacts:
    paths:
      - target/release/bundle/appimage/*.AppImage
    expire_in: 1 week
